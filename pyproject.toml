[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ogoniland-appraisal"
version = "0.1.0"
requires-python = ">=3.11"
# Pins live in requirements-lock.txt; this file declares minimums only.
dependencies = ["pandas>=3.1", "numpy>=2.5", "requests>=2.32", "beautifulsoup4>=4.13"]

[project.optional-dependencies]
dev = ["pytest", "jupyterlab"]

[tool.setuptools.packages.find]
where = ["src"]
